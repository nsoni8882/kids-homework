<!DOCTYPE html>
<html lang="en-GB" data-child="mason">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Weekly homework progress tracker.">
<meta name="color-scheme" content="light dark">
<title>Progress Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='20'>&#128202;</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/theme.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" defer></script>
</head>
<body>

<a class="skip-link" href="#app">Skip to the tracker</a>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 15l4-5 3 3 5-7"/>
        </svg>
      </span>
      <div class="brand-text">
        <div class="brand-title">Progress Tracker</div>
        <div class="brand-sub">Kumon aligned weekly homework</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn-icon" id="theme-btn" type="button" aria-label="Switch colour theme"></button>
    </div>
  </div>
</header>

<main class="page">
  <div id="loading" class="center-state">
    <div class="spinner" role="status" aria-label="Loading"></div>
    <p>Loading the tracker</p>
  </div>

  <div id="error" hidden></div>

  <div id="app" hidden>
    <div class="tabs" role="tablist" aria-label="Choose a child">
      <button class="tab" role="tab" type="button" data-kid="mason"
              aria-selected="true" aria-controls="panel-mason" id="tab-mason">
        <span class="dot" aria-hidden="true"></span> Mason
      </button>
      <button class="tab" role="tab" type="button" data-kid="elysia"
              aria-selected="false" aria-controls="panel-elysia" id="tab-elysia" tabindex="-1">
        <span class="dot" aria-hidden="true"></span> Elysia
      </button>
    </div>
    <div id="panel-mason" role="tabpanel" aria-labelledby="tab-mason" tabindex="0"></div>
    <div id="panel-elysia" role="tabpanel" aria-labelledby="tab-elysia" tabindex="0" hidden></div>
  </div>
</main>

<script type="module" src="assets/dashboard.js"></script>
</body>
</html>
